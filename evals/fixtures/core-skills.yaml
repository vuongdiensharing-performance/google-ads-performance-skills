# Compact fixture matrix: four canonical cases per Core Skill.
# Detailed account-audit fixtures live in account-audit.yaml.
skills:
  campaign-strategy:
    PASS: {context: {intent_framework: valid, business_goal: qualified_leads}, expected: pass}
    FAIL: {context: {business_goal: missing, mixed_intent: true}, expected: fail}
    INSUFFICIENT_EVIDENCE: {context: {business_goal: unknown}, expected: insufficient_evidence}
    FALSE_POSITIVE: {context: {mixed_intent: true, deliberate_segmentation: true}, expected: no_finding}
  campaign-structure:
    PASS: {context: {intent_themes: aligned, fragmentation: false}, expected: pass}
    FAIL: {context: {fragmentation: true, no_business_reason: true}, expected: fail}
    INSUFFICIENT_EVIDENCE: {context: {campaign_purpose: unknown}, expected: insufficient_evidence}
    FALSE_POSITIVE: {context: {fragmentation: true, justified: true}, expected: no_finding}
