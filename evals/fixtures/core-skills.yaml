    PASS: {context: {relevance: high, spend: 100, conversions: 3}, expected: pass}
    FAIL: {context: {relevance: low, spend: 500, conversions: 0}, expected: fail}
    INSUFFICIENT_EVIDENCE: {context: {spend: 10, conversions: 0}, expected: insufficient_evidence}
    FALSE_POSITIVE: {context: {spend: 500, conversions: 1, conversion_lag: true}, expected: no_finding}
