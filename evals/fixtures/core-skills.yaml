    FAIL: {context: {intent_classified: false, mismatch: true}, expected: fail}
    INSUFFICIENT_EVIDENCE: {context: {market_data: missing}, expected: insufficient_evidence}
    FALSE_POSITIVE: {context: {broad_match: true, smart_bidding: true}, expected: no_finding}
