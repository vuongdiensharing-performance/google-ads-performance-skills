name: Account Audit Golden Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Validate Rules
        run: python scripts/validate_rules.py --rules rules
      - name: Validate Skills
        run: python scripts/validate_skills.py --skills skills --registry skills/registry.yaml
      - name: Run account-audit golden benchmark
        run: |
          mkdir -p artifacts
          python scripts/benchmark_account_audit.py \
            --benchmark evals/account-audit/benchmark.yaml \
            --rules rules \
            --registry skills/registry.yaml \
            --json-out artifacts/account-audit-benchmark.json
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: account-audit-benchmark
          path: artifacts/account-audit-benchmark.json
