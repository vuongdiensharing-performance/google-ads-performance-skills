name: Validate Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/validate_rules.py --rules rules
      - run: python scripts/validate_skills.py --skills skills --registry skills/registry.yaml
      - run: python scripts/evaluate_fixtures.py --fixtures evals/fixtures
      - run: python scripts/evaluate_gemini_account_audit.py --mode offline
      - name: Gate 2C.1A — Boundary Contract Validator
        run: >-
          python scripts/validate_boundary_contract.py
          --rules rules
          --registry rules/registry.yaml
          --rule-ids STR-FRAG-001 CV-TRACK-001 BID-OBJ-001 BUD-OPP-001 ST-SPEND-001 PMAX-GOAL-001
      - name: Gate 2C.1 — 36 Boundary Fixtures + State Machine
        run: python scripts/test_boundary_machine.py --fixtures evals/account-audit/boundary_matrix.yaml --runs 5
      - name: Gate 2C.2 — Determinism (5 identical executions per fixture)
        run: python scripts/test_boundary_machine.py --fixtures evals/account-audit/boundary_matrix.yaml --runs 5
      - name: Validate GA4 report evidence contract
        run: python scripts/validate_ga4_evidence_contract.py --fixture evals/ga4/ga4_evidence_contract.yaml
      - name: Validate GA4 identity evidence contract
        run: python scripts/validate_ga4_evidence_contract.py --fixture evals/ga4/ga4_identity_contract.yaml
      - name: Validate GA4 linkage evidence contract
        run: python scripts/validate_ga4_evidence_contract.py --fixture evals/ga4/ga4_linkage_contract.yaml
      - name: Validate GA4 query contract
        run: python scripts/validate_ga4_query.py --fixture evals/ga4/ga4_query_contract.yaml
      - name: Test GA4 query contract
        run: python -m unittest tests.test_ga4_query_contract -v
      - name: Test GA4 read-only adapter
        run: python -m unittest discover -s tests -p 'test_ga4_readonly_adapter.py' -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r scripts/requirements.txt
      - run: pip install pip-audit bandit
      - run: pip-audit -r scripts/requirements.txt
      - run: bandit -r scripts integrations -x scripts/test_rule_engine.py,scripts/evaluate_fixtures.py -ll
