id: ST-SPEND-001
name: High Spend Without Conversion
version: 1.1.1
category: search_term
description: Flag a search term that has consumed meaningful spend without a recorded target conversion.
when:
  all:
    - spend > 0
    - conversions == 0
    - evidence.spend_is_material == true
exclude_when:
  - conversion_lag_not_mature == true
  - tracking_integrity_unknown == true
severity:
  level: medium
confidence:
  level: medium
evidence_required:
  - spend
  - conversions
  - target_conversion_definition
  - conversion_lag
finding:
  title: Material spend has produced no recorded target conversion
recommendation:
  - inspect_search_intent
  - inspect_landing_page
  - inspect_conversion_tracking
  - consider_negative_or_bid_action_only_after_context_review
impact:
  dimension: wasted_spend
  level: medium
action:
  type: investigate
human_approval_required: true
related_skills:
  - search-term-analysis
  - performance-diagnosis
  - conversion-tracking
knowledge_dependencies:
  - knowledge/search/search-term-methodology.md
  - knowledge/measurement/conversion-framework.md
  - knowledge/analytics/performance-diagnosis.md
boundary_contract:
  version: "1.0.0"
  applicable_when:
    - search_term_analysis_in_scope: true
  evidence_required:
    - spend
    - conversions
    - target_conversion_definition
    - conversion_lag
  states:
    A: {state: APPLICABLE_VALID, decision: PASS, finding_generated: false}
    B: {state: APPLICABLE_TRIGGERED, decision: FAIL, finding_generated: true}
    C: {state: APPLICABLE_MISSING_EVIDENCE, decision: INSUFFICIENT_EVIDENCE, finding_generated: false}
    D: {state: NOT_APPLICABLE, decision: NOT_APPLICABLE, finding_generated: false}
    E: {state: CONFLICTING_EVIDENCE, decision: POLICY_DEFINED, finding_generated: false}
    F: {state: EXPLICIT_EXCLUSION, decision: SUPPRESSED, finding_generated: false}
  conflict_policy:
    enabled: true
    when:
      all:
        - spend: 0
        - conversions: 0
        - evidence.spend_is_material: true
        - material: true
    resolution:
      state: CONFLICTING_EVIDENCE
      decision: FAIL
      inference_used: false
