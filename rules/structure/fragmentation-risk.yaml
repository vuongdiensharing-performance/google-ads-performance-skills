id: STR-FRAG-001
name: Campaign Fragmentation Risk
version: 1.1.0
category: structure
description: Flag excessive campaign or ad-group fragmentation when a normalized fragmentation-risk signal is present and no valid control or reporting requirement justifies the separation.
when:
  all:
    - fragmentation_risk_signal == true
exclude_when:
  - budget_or_bidding_control_requires_separation == true
  - geography_or_business_unit_requires_separation == true
severity:
  level: medium
confidence:
  level: medium
evidence_required:
  - campaign_structure
  - intent_mapping
  - volume_or_conversion_density
  - separation_reason
finding:
  title: Account structure may be fragmented beyond the data available
recommendation:
  - evaluate_consolidation
  - preserve_separation_only_when_it_serves_a_real_control
impact:
  dimension: efficiency
  level: medium
action:
  type: recommend
human_approval_required: true
related_skills:
  - campaign-structure
  - account-audit
  - budget-optimization
knowledge_dependencies:
  - knowledge/structure/account-structure.md
boundary_contract:
  version: "1.0.0"
  applicable_when:
    - structure_analysis_in_scope: true
  evidence_required:
    - campaign_structure
    - intent_mapping
    - volume_or_conversion_density
    - separation_reason
  states:
    A:
      state: APPLICABLE_VALID
    B:
      state: APPLICABLE_TRIGGERED
    C:
      state: APPLICABLE_MISSING_EVIDENCE
    D:
      state: NOT_APPLICABLE
    E:
      state: CONFLICTING_EVIDENCE
    F:
      state: EXPLICIT_EXCLUSION
  conflict_policy:
    enabled: true
    when:
      all:
        - fragmentation_risk_signal: true
        - geography_or_business_unit_requires_separation: true
        - separation_reason: none
    resolution:
      state: CONFLICTING_EVIDENCE
      decision: FAIL
      inference_used: false
