id: BUD-OPP-001
name: Budget Constraint With Proven Opportunity
version: 1.1.1
category: budget
description: Flag campaigns that are materially budget constrained while meeting the business efficiency target and showing validated incremental opportunity.
when:
  all:
    - budget_limited == true
    - performance.meets_business_target == true
    - evidence.incremental_opportunity_validated == true
exclude_when:
  - conversion_tracking_is_unreliable == true
  - business_target_is_missing == true
severity:
  level: medium
confidence:
  level: medium
evidence_required:
  - budget_status
  - performance_metrics
  - business_target
  - incremental_opportunity_validated
finding:
  title: Campaign may have room to scale under a constrained budget
recommendation:
  - evaluate_incremental_budget
  - model_expected_marginal_return
impact:
  dimension: scale
  level: high
action:
  type: recommend
human_approval_required: true
related_skills:
  - budget-optimization
  - performance-diagnosis
knowledge_dependencies:
  - knowledge/bidding/bidding-principles.md
  - knowledge/analytics/performance-diagnosis.md
boundary_contract:
  version: "1.0.0"
  applicable_when:
    - budget_analysis_in_scope: true
  evidence_required:
    - budget_status
    - performance_metrics
    - business_target
    - incremental_opportunity_validated
  states:
    A: {state: APPLICABLE_VALID, decision: PASS, finding_generated: false}
    B: {state: APPLICABLE_TRIGGERED, decision: FAIL, finding_generated: true}
    C: {state: APPLICABLE_MISSING_EVIDENCE, decision: INSUFFICIENT_EVIDENCE, finding_generated: false}
    D: {state: NOT_APPLICABLE, decision: NOT_APPLICABLE, finding_generated: false}
    E: {state: CONFLICTING_EVIDENCE, decision: POLICY_DEFINED, finding_generated: false}
    F: {state: EXPLICIT_EXCLUSION, decision: SUPPRESSED, finding_generated: false}
  conflict_policy:
    enabled: true
    when:
      all:
        - budget_limited: true
        - performance.meets_business_target: true
        - evidence.incremental_opportunity_validated: true
        - target_met: false
    resolution:
      state: CONFLICTING_EVIDENCE
      decision: FAIL
      inference_used: false
