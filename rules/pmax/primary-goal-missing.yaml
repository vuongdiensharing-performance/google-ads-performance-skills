id: PMAX-GOAL-001
name: PMax Primary Conversion Goal Risk
version: 1.1.1
category: pmax
description: Flag PMax when the active primary conversion goal is missing, invalid, or not aligned with the campaign objective.
when:
  all:
    - campaign_type == performance_max
    - primary_conversion_goal.status != valid
exclude_when:
  - campaign_is_intentionally_unoptimized_for_goal_exploration == true
severity:
  level: critical
confidence:
  level: high
evidence_required:
  - campaign_objective
  - primary_conversion_goal
  - conversion_tracking_status
finding:
  title: PMax lacks a valid primary conversion goal aligned to the campaign objective
recommendation:
  - fix_primary_conversion_goal
  - validate_tracking_before_evaluating_delivery
impact:
  dimension: measurement_risk
  level: critical
action:
  type: investigate
human_approval_required: true
related_skills:
  - pmax-optimization
  - conversion-tracking
knowledge_dependencies:
  - knowledge/pmax/pmax-principles.md
  - knowledge/measurement/conversion-framework.md
boundary_contract:
  version: "1.0.0"
  applicable_when:
    - campaign_type: performance_max
  evidence_required:
    - campaign_objective
    - primary_conversion_goal
    - conversion_tracking_status
  states:
    A: {state: APPLICABLE_VALID, decision: PASS, finding_generated: false}
    B: {state: APPLICABLE_TRIGGERED, decision: FAIL, finding_generated: true}
    C: {state: APPLICABLE_MISSING_EVIDENCE, decision: INSUFFICIENT_EVIDENCE, finding_generated: false}
    D: {state: NOT_APPLICABLE, decision: NOT_APPLICABLE, finding_generated: false}
    E: {state: CONFLICTING_EVIDENCE, decision: POLICY_DEFINED, finding_generated: false}
    F: {state: EXPLICIT_EXCLUSION, decision: SUPPRESSED, finding_generated: false}
  conflict_policy:
    enabled: true
    when:
      all:
        - campaign_type: performance_max
        - primary_conversion_goal.status: missing
        - override: true
    resolution:
      state: CONFLICTING_EVIDENCE
      decision: FAIL
      inference_used: false
