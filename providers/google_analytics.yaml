provider_id: google_analytics
provider_name: Google Analytics MCP
integration_version: 0.1.0
mode: read_only
transport: mcp

upstream:
  repository: https://github.com/googleanalytics/google-analytics-mcp.git
  ref: main
  pinned_commit: a8ca729d4a8fa99bffe87962c17c0539c6aa9da7
  package: analytics-mcp
  package_version: 0.7.0
  license: Apache-2.0
  maturity: beta

allowed_tools:
  - get_account_summaries
  - get_property_details
  - list_google_ads_links
  - run_report
  - run_funnel_report
  - get_custom_dimensions_and_metrics
  - run_realtime_report

trust_boundary:
  external_data_untrusted: true
  may_generate_rule_decision: false
  may_generate_boundary_state: false
  may_invent_evidence: false
  inference_used_must_be: false

identity_requirements:
  property_id_required: true
  property_id_format: "properties/<numeric_id>"

provenance_requirements:
  source_verified: true
  retrieved_at_required: true
  provider_commit_required: true
  request_fingerprint_recommended: true
